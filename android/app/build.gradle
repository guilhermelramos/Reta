apply plugin: 'com.android.application'

// --- Assinatura de release ---------------------------------------------------
// Lê RETA_KEYSTORE_PATH, RETA_KEYSTORE_PASSWORD, RETA_KEY_ALIAS e
// RETA_KEY_PASSWORD do ambiente. Se alguma faltar, usa android/keystore.properties
// (ignorado pelo git) com storeFile, storePassword, keyAlias e keyPassword.
// O signingConfig só é aplicado ao release quando as quatro estão definidas e a
// keystore existe; caso contrário, apenas avisa e o build debug segue normal.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStoreFileValue = System.getenv('RETA_KEYSTORE_PATH') ?: keystoreProperties.getProperty('storeFile')
def releaseStorePassword = System.getenv('RETA_KEYSTORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword')
def releaseKeyAlias = System.getenv('RETA_KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('RETA_KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')

def releaseStoreFile = releaseStoreFileValue ? rootProject.file(releaseStoreFileValue.trim()) : null
def releaseSigningReady = releaseStoreFile != null &&
        releaseStoreFile.exists() &&
        [releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace = "com.guilhermelramos.reta"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.guilhermelramos.reta"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('Reta: release sem assinatura. Defina RETA_KEYSTORE_PATH, RETA_KEYSTORE_PASSWORD, RETA_KEY_ALIAS e RETA_KEY_PASSWORD (ou android/keystore.properties). O APK debug continua funcionando.')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
